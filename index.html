<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poa</title>
<!-- These lines help readers, crawlers and search engines find this Poa.
     To stay out of search, remove them (and the "This is a Poa" line below)
     and add "search: no" to poa.md. -->
<meta name="poa" content="1">
<link rel="alternate" type="text/markdown" title="Poa" href="poa.md">
<style>
  :root {
    --side-bg: #f3f4f6;
    --text: #1f2328;
    --muted: #59636e;
    --accent: #1f5f8b;
    --active-bg: #e3e8ed;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  a { color: var(--accent); }

  /* Sidebar */
  aside {
    width: 300px;
    flex-shrink: 0;
    background: var(--side-bg);
    padding: 36px 24px 28px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .back { font-size: 14px; text-decoration: none; margin: 0 12px 20px; display: inline-block; }
  .back:hover { text-decoration: underline; }
  h2.label {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 12px 14px;
  }
  h2.label + ul { margin-bottom: 40px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li a {
    display: block;
    padding: 8px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  ul.list li a:hover { background: var(--active-bg); }
  ul.list li a.active { background: var(--active-bg); color: var(--accent); font-weight: 600; }
  .other-name { font-weight: 600; display: block; }
  .other-post { color: var(--muted); display: block; margin-top: 2px; }
  .other.offline { opacity: 0.45; }
  .empty { color: var(--muted); font-size: 14px; margin: 0 12px 40px; }
  .foot { margin-top: auto; padding: 24px 12px 0; display: flex; align-items: baseline; gap: 14px; }
  .foot strong { font-size: 18px; }
  .foot { position: relative; }
  .foot button.what {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline;
  }
  .foot button.what:hover { color: var(--text); }
  .tip {
    position: absolute;
    left: 0;
    bottom: calc(100% + 10px);
    width: 240px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    z-index: 10;
  }
  .tip[hidden] { display: none; }
  .tip p { margin: 0 0 8px; }
  .tip a { font-weight: 600; text-decoration: none; }
  .tip a:hover { text-decoration: underline; }

  /* Post */
  main { flex: 1; padding: 64px 48px 96px; min-width: 0; }
  article { max-width: 680px; margin: 0 auto; }
  .meta { font-size: 16px; color: var(--muted); margin-bottom: 8px; }
  .meta a { color: var(--text); font-weight: 600; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  article h1.title { font-size: 40px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 36px; }
  .body { font-size: 18px; line-height: 1.75; }
  .body h1, .body h2, .body h3 { line-height: 1.25; margin: 1.6em 0 0.6em; }
  .body h2 { font-size: 26px; }
  .body img { max-width: 100%; }
  .body pre { background: var(--side-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 15px; }
  .body code { font-size: 0.9em; }
  .body blockquote { margin: 0; padding-left: 18px; border-left: 3px solid var(--line); color: var(--muted); }
  .notice { color: var(--muted); font-size: 18px; }

  /* Search */
  form.search { margin: 0 12px 32px; }
  form.search input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 8px 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  form.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .status { color: var(--muted); font-size: 15px; margin: -20px 0 24px; }
  ul.results { list-style: none; margin: 0; padding: 0; }
  ul.results li a {
    display: block;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
  }
  ul.results li a:hover .r-title { color: var(--accent); }
  .r-meta { color: var(--muted); font-size: 14px; }
  .r-title { font-size: 20px; font-weight: 600; margin: 2px 0; display: block; }
  .r-snip { color: var(--muted); font-size: 16px; line-height: 1.5; }
  .r-snip mark { background: #fff1b8; color: var(--text); }
  .scope { display: flex; gap: 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .scope label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .scope input { margin: 0; accent-color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .filters button {
    font: inherit; font-size: 14px; cursor: pointer;
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid #d0d7de; background: #fff; color: var(--text);
  }
  .filters button:hover { border-color: var(--accent); }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cat {
    display: inline-block; vertical-align: 1px; margin-left: 6px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    border: 1px solid #d0d7de; border-radius: 999px; padding: 0 7px;
  }
  .meta a.cat-link { font-weight: 400; color: var(--muted); }
  .poa-line { max-width: 680px; margin: 64px auto 0; font-size: 13px; color: var(--muted); }
  .poa-line a { color: var(--muted); }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: auto; height: auto; position: static; padding: 24px 16px; order: 2; }
    main { padding: 32px 20px 64px; }
    article h1.title { font-size: 30px; }
  }
</style>
</head>
<body>
<aside id="side"></aside>
<main>
<article id="post"></article>
<p class="poa-line">This is a Poa · part of the <a href="https://github.com/topics/poa">Poa network</a> · <a href="https://gearnoodle.github.io/poa-directory/">Browse the Poa directory</a></p>
</main>

<script src="markdown-it.min.js"></script>
<script>
"use strict";

// "Read more" under "what is poa?" points to this Poa's own repo when the site runs on
// GitHub Pages or Codeberg Pages. Elsewhere it uses this:
const WHAT_IS_POA_FALLBACK = "https://github.com/topics/poa";

function readMoreUrl() {
  const host = location.hostname.toLowerCase();
  const first = location.pathname.split("/")[1] || "";
  const folder = first && !first.includes(".") ? first : "";
  // GitHub: username.github.io/poa/ lives in repo "poa"; username.github.io/ in repo "username.github.io".
  let m = host.match(/^([a-z0-9-]+)\.github\.io$/);
  if (m) return "https://github.com/" + m[1] + "/" + (folder || host) + "#readme";
  // Codeberg: username.codeberg.page/poa/ lives in repo "poa"; username.codeberg.page/ in repo "pages".
  m = host.match(/^([a-z0-9-]+)\.codeberg\.page$/);
  if (m) return "https://codeberg.org/" + m[1] + "/" + (folder || "pages");
  return WHAT_IS_POA_FALLBACK;
}
const WHAT_IS_POA = readMoreUrl();

// Search walks the "Poas I read" lists outward from your own Poa.
const SEARCH_STEPS = 3;        // how many steps away from you
const SEARCH_MAX_POAS = 150;   // stop after this many Poas
const SEARCH_POSTS_EACH = 10;  // full text of each Poa's newest posts
// "Everywhere" also asks GitHub for public repos named "poa" or tagged with the topic "poa",
// and loads the Poa directory, an opt-in list people add their own Poa to (on any host).
const DISCOVER_MAX_POAS = 100;    // check at most this many from each
const DISCOVER_KEEP_MINUTES = 30; // GitHub limits how often it answers, so keep its answer a while
// The Poa directory (github.com/gearnoodle/poa-directory). Use "" to leave it out, or point
// it at any other list in the same format.
const DIRECTORY = "https://raw.githubusercontent.com/gearnoodle/poa-directory/main/poas.md";
// The directory's browsing page, linked from "what is poa?" and the "This is a Poa" line.
const DIRECTORY_SITE = "https://gearnoodle.github.io/poa-directory/";

const md = window.markdownit({ html: false, linkify: true });
const HOME = new URL("poa.md", location.href).href;
const cache = new Map();

// ---------- Parsing ----------

function splitHeader(text) {
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const header = {};
  if (text.startsWith("---\n")) {
    const end = text.indexOf("\n---", 4);
    if (end !== -1) {
      for (const line of text.slice(4, end).split("\n")) {
        const i = line.indexOf(":");
        if (i > 0) header[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
      }
      text = text.slice(end + 4).replace(/^[^\n]*\n/, "");
    }
  }
  return { header, body: text };
}

function parsePoa(text, url) {
  const { header, body } = splitHeader(text);
  const posts = [], reads = [];
  let section = null;
  for (const raw of body.split("\n")) {
    const line = raw.trim();
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      const name = h[1].toLowerCase();
      section = name.startsWith("post") ? "posts" : name.includes("read") ? "reads" : null;
      continue;
    }
    const item = line.match(/^[-*+]\s+(.*)$/);
    if (!item || !section) continue;
    const link = item[1].match(/^\[([^\]]*)\]\(([^)\s]+)\)/);
    if (section === "posts" && link) {
      posts.push({ title: link[1], href: link[2] });
    } else if (section === "reads") {
      reads.push(link ? link[2] : item[1].split(/\s/)[0]);
    }
  }
  return {
    url,
    version: header.version,
    isPoa: !!header.version,
    name: header.name || new URL(url).host,
    category: cleanCategory(header.category),
    noSearch: /^no$/i.test(header.search || ""),
    posts,
    reads,
  };
}

// Categories ignore capitals. A Poa or post without one is "uncategorized".
const UNCATEGORIZED = "uncategorized";
function cleanCategory(s) {
  return (s || "").trim().toLowerCase();
}

// An address may be "name.github.io/poa", a full https URL, or a direct link to a .md file.
function poaUrl(address) {
  let a = address.trim();
  if (!/^https?:\/\//i.test(a)) a = "https://" + a;
  if (/\.md$/i.test(a)) return new URL(a).href;
  if (!a.endsWith("/")) a += "/";
  return new URL("poa.md", a).href;
}

// Like poaUrl, but returns null for an address that can't be read.
function safePoaUrl(address) {
  try { return poaUrl(address); } catch { return null; }
}

// One Poa can be written many ways: "a.github.io/poa", "https://a.github.io/poa/",
// "https://a.github.io/poa/poa.md". This turns them all into "a.github.io/poa".
function poaKey(url) {
  return url.trim().toLowerCase()
    .replace(/^https?:\/\//, "")
    .replace(/\/poa\.md$/, "")
    .replace(/\/+$/, "");
}

function dateFrom(href) {
  const m = href.match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : "";
}

function formatDate(s) {
  const d = new Date(s + "T12:00:00");
  if (isNaN(d)) return s;
  return d.toLocaleDateString("en", { month: "short", day: "numeric", year: "numeric" });
}

// ---------- Fetching ----------

async function fetchText(url) {
  const res = await fetch(url, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  return res.text();
}

function loadPoa(url) {
  if (!cache.has(url)) {
    cache.set(url, fetchText(url).then(t => parsePoa(t, url)).catch(() => null));
  }
  return cache.get(url);
}

// ---------- Routing ----------
// #post=FILE                  a post on my own Poa
// #poa=URL                    visiting someone's Poa (their newest post)
// #poa=URL&post=FILE          a post on someone's Poa

function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { poa: p.get("poa") || HOME, post: p.get("post") };
}

// #q=TERM                     search
// #q=TERM&cat=CAT             search, showing one category
// #cat=CAT                    everything in one category (#cat= for everything)
// &in=all                     search "Everywhere" instead of "My network"
function searchLink(q, cat, wide) {
  const p = new URLSearchParams();
  if (q) p.set("q", q);
  if (cat || (!q && cat != null)) p.set("cat", cat || "");
  if (wide) p.set("in", "all");
  return "#" + p.toString();
}

// "My network" or "Everywhere", remembered in this browser if it allows it.
let everywhere = false;
try { everywhere = localStorage.getItem("poa-scope") === "all"; } catch {}
function rememberScope() {
  try { localStorage.setItem("poa-scope", everywhere ? "all" : "network"); } catch {}
}

function link(poa, post) {
  const p = new URLSearchParams();
  if (poa !== HOME) p.set("poa", poa);
  if (post) p.set("post", post);
  const s = p.toString();
  return s ? "#" + s : "#";
}

// ---------- Rendering ----------

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function footer() {
  const tip = el("div", { class: "tip", id: "what-tip", role: "dialog", hidden: "" },
    el("p", {}, "Poa is a small personal site made of Markdown files. Every Poa lists the Poas its owner reads, and you find your way around by hopping from list to list."),
    el("p", {}, "No central server, no signup, no algorithm."),
    el("p", {}, el("a", { href: WHAT_IS_POA }, "Read more →")),
    el("a", { href: DIRECTORY_SITE }, "Browse the Poa directory →"));
  const btn = el("button", { type: "button", class: "what", "aria-expanded": "false", "aria-controls": "what-tip" }, "what is poa?");
  const toggle = open => {
    tip.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  };
  btn.addEventListener("click", e => { e.stopPropagation(); toggle(tip.hidden); });
  tip.addEventListener("click", e => e.stopPropagation());
  closeTip = () => toggle(false);
  return el("div", { class: "foot" }, el("strong", {}, "poa"), btn, tip);
}
let closeTip = () => {};
document.addEventListener("click", () => closeTip());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTip(); });

function searchBox(q) {
  const input = el("input", { type: "search", name: "q", placeholder: "Search all Poas", "aria-label": "Search all Poas" });
  input.value = q || "";
  const scope = el("div", { class: "scope", role: "radiogroup", "aria-label": "Where to search" });
  for (const [wide, label] of [[false, "My network"], [true, "Everywhere"]]) {
    const radio = el("input", { type: "radio", name: "scope", value: wide ? "all" : "network" });
    radio.checked = everywhere === wide;
    radio.addEventListener("change", () => {
      everywhere = wide;
      rememberScope();
      // If results are showing, run them again with the new choice.
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.get("q") || p.has("cat")) location.hash = searchLink(p.get("q"), p.get("cat"), everywhere);
    });
    scope.append(el("label", {}, radio, label));
  }
  const form = el("form", { class: "search", role: "search" }, input, scope);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const term = input.value.trim();
    if (term) location.hash = searchLink(term, null, everywhere);
  });
  return form;
}

// A Poa's name, with its category as a small label.
function nameWithCategory(poa) {
  return poa.category ? [poa.name, el("span", { class: "cat" }, poa.category)] : [poa.name];
}

async function renderSide(poa, current, q) {
  const side = document.getElementById("side");
  const visiting = poa.url !== HOME;
  side.replaceChildren(searchBox(q));

  if (visiting) {
    const home = await loadPoa(HOME);
    side.append(el("a", { class: "back", href: "#" }, "← Back to " + (home ? home.name : "my Poa")));
  }

  side.append(el("h2", { class: "label" }, visiting ? poa.name : "Mine"));
  const mine = el("ul", { class: "list" });
  for (const p of poa.posts) {
    const a = el("a", { href: link(poa.url, p.href) }, p.title);
    if (p.href === current) a.classList.add("active");
    mine.append(el("li", {}, a));
  }
  side.append(poa.posts.length ? mine : el("p", { class: "empty" }, "No posts yet."));

  side.append(el("h2", { class: "label" }, visiting ? poa.name + " reads" : "Others"));
  const others = el("ul", { class: "list" });
  side.append(poa.reads.length ? others : el("p", { class: "empty" }, "Not reading anyone yet."));

  const items = poa.reads.map(addr => {
    const url = poaUrl(addr);
    const a = el("a", { href: link(url), class: "other" },
      el("span", { class: "other-name" }, addr),
      el("span", { class: "other-post" }, "…"));
    const li = el("li", {}, a);
    others.append(li);
    return { url, a, li, date: "" };
  });

  // READ BY: Poas whose "Poas I read" list includes this one. Shown on your own Poa only.
  if (!visiting) {
    side.append(el("h2", { class: "label" }, "Read by"));
    const looking = el("p", { class: "empty" }, "Looking…");
    side.append(looking);
    findReaders().then(readers => {
      if (!looking.isConnected) return;
      if (!readers.length) {
        looking.textContent = "Nobody found yet.";
        return;
      }
      const list = el("ul", { class: "list" });
      for (const r of readers.sort((a, b) => a.name.localeCompare(b.name))) {
        list.append(el("li", {}, el("a", { href: link(r.url), class: "other" },
          el("span", { class: "other-name" }, ...nameWithCategory(r)),
          el("span", { class: "other-post" }, poaKey(r.url)))));
      }
      looking.replaceWith(list);
    });
  }

  side.append(footer());

  // Fill in others as they arrive, then sort newest first.
  await Promise.all(items.map(async it => {
    const other = await loadPoa(it.url);
    const [name, post] = it.a.children;
    if (!other) {
      it.a.classList.add("offline");
      post.textContent = "unreachable";
      return;
    }
    name.replaceChildren(...nameWithCategory(other));
    const latest = other.posts[0];
    post.textContent = latest ? latest.title : "No posts yet";
    if (latest) {
      it.a.href = link(other.url, latest.href);
      it.date = dateFrom(latest.href);
    }
  }));
  items
    .sort((x, y) => (y.date > x.date) - (y.date < x.date))
    .forEach(it => others.append(it.li));
}

function fixLinks(container, base, poa) {
  const origin = new URL(base).origin;
  const folder = new URL(".", poa.url).href;
  for (const img of container.querySelectorAll("img")) {
    const src = new URL(img.getAttribute("src"), base);
    // Only load images from the Poa's own site.
    if (src.origin !== origin) {
      img.replaceWith(el("a", { href: src.href }, img.alt || src.href));
    } else {
      img.src = src.href;
    }
  }
  for (const a of container.querySelectorAll("a[href]")) {
    const href = a.getAttribute("href");
    if (href.startsWith("#")) continue;
    const target = new URL(href, base).href;
    if (/\.md$/i.test(target) && target.startsWith(folder) && !target.endsWith("/poa.md")) {
      // A link to another post on the same Poa opens in the reader.
      a.href = link(poa.url, target.slice(folder.length));
    } else {
      a.href = target;
      a.rel = "noopener nofollow";
    }
  }
}

async function renderPost(poa, href) {
  const article = document.getElementById("post");
  if (!href) {
    article.replaceChildren(el("p", { class: "notice" }, poa.name + " hasn't posted anything yet."));
    document.title = poa.name + " · poa";
    return;
  }
  const url = new URL(href, poa.url).href;
  let text;
  try {
    text = await fetchText(url);
  } catch {
    article.replaceChildren(el("p", { class: "notice" }, "This post is unavailable right now."));
    return;
  }
  const { header, body } = splitHeader(text);
  const listed = poa.posts.find(p => p.href === href);
  const title = header.title || (listed && listed.title) || href;
  const date = header.date || dateFrom(href);

  const category = cleanCategory(header.category) || poa.category;
  const meta = el("div", { class: "meta" },
    el("a", { href: link(poa.url) }, poa.name),
    date ? " · " + formatDate(date) : null,
    category ? " · " : null,
    category ? el("a", { class: "cat-link", href: searchLink(null, category, everywhere), title: "More in " + category }, category) : null);
  const content = el("div", { class: "body" });
  content.innerHTML = md.render(body); // raw HTML is disabled in the renderer
  fixLinks(content, url, poa);

  article.replaceChildren(meta, el("h1", { class: "title" }, title), content);
  document.title = title + " · " + poa.name;
  window.scrollTo(0, 0);
}

// ---------- Search ----------

// A post's plain text, plus the header fields search needs.
const textCache = new Map();
function loadBody(url) {
  if (!textCache.has(url)) {
    textCache.set(url, fetchText(url).then(t => {
      const { header, body } = splitHeader(t);
      return { text: plain(body), category: cleanCategory(header.category), date: header.date || "" };
    }).catch(() => null));
  }
  return textCache.get(url);
}

// Markdown to rough plain text, for matching and snippets.
function plain(s) {
  return s
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[*_`~]/g, "")
    .replace(/[#>|]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .normalize("NFC");
}

// Lowercase and ignore accents, so "jarvinen" finds "Järvinen".
function fold(s) {
  return s.normalize("NFC").split("").map(c => c.normalize("NFD")[0]).join("").toLowerCase();
}

// Run at most n fetches at a time.
function limiter(n) {
  let active = 0;
  const queue = [];
  const next = () => {
    if (active >= n || !queue.length) return;
    active++;
    const { fn, resolve } = queue.shift();
    fn().then(resolve, () => resolve(null)).finally(() => { active--; next(); });
  };
  return fn => new Promise(resolve => { queue.push({ fn, resolve }); next(); });
}
const limit = limiter(6);

// Walk the "Poas I read" lists outward from your own Poa, one step at a time, calling
// visit(poa, depth) for each Poa reached. Returns the keys of the Poas visited.
async function walk(visit, alive) {
  const seen = new Set([poaKey(HOME)]);
  const visited = new Set();
  let layer = [HOME];
  for (let depth = 0; layer.length && depth <= SEARCH_STEPS; depth++) {
    const poas = await Promise.all(layer.map(u => limit(() => loadPoa(u))));
    if (!alive()) return visited;
    const next = [];
    for (const poa of poas) {
      if (!poa) continue;
      visited.add(poaKey(poa.url));
      visit(poa, depth);
      for (const addr of poa.reads) {
        const u = safePoaUrl(addr);
        if (!u) continue;
        const k = poaKey(u);
        if (!seen.has(k) && seen.size < SEARCH_MAX_POAS) { seen.add(k); next.push(u); }
      }
    }
    layer = depth < SEARCH_STEPS ? next : [];
  }
  return visited;
}

// ---------- Discovery ----------
// Finds Poas outside your network, from two places:
// - the Poa directory, a plain list people add their own Poa to (any host works);
// - GitHub: public repos with the topic "poa", and repos named "poa", that have GitHub Pages
//   turned on. GitHub's search works without a login but allows only a few searches a
//   minute, so the answer is kept for a while.
// Each address found is checked later: only a real poa.md counts.

let discoveryPromise = null;
function discover() {
  if (!discoveryPromise) discoveryPromise = Promise.all([fromDirectory(), fromGitHub()])
    .then(([directory, github]) => ({ directory, github }));
  return discoveryPromise;
}

async function fromDirectory() {
  if (!DIRECTORY) return { urls: [], ok: true };
  try {
    return { urls: parseDirectory(await fetchText(DIRECTORY)), ok: true };
  } catch {
    return { urls: [], ok: false };
  }
}

// The directory is a Markdown list with one Poa address per line, like "Poas I read":
//   - marta.github.io/poa
//   - [Jordi](https://jordi.example.com/poa)
// Anything after the address on a line is ignored, and so is every line that isn't a list item.
function parseDirectory(text) {
  const found = new Map();
  for (const raw of splitHeader(text).body.split("\n")) {
    const item = raw.trim().match(/^[-*+]\s+(.*)$/);
    if (!item) continue;
    const link = item[1].match(/^\[[^\]]*\]\(([^)\s]+)\)/);
    const u = safePoaUrl(link ? link[1] : item[1].split(/\s/)[0]);
    if (u && u.startsWith("https://")) found.set(poaKey(u), u);
  }
  return [...found.values()];
}

async function fromGitHub() {
  const KEY = "poa-discovery";
  try {
    const kept = JSON.parse(sessionStorage.getItem(KEY));
    if (kept && Date.now() - kept.at < DISCOVER_KEEP_MINUTES * 60000) return { urls: kept.urls, ok: true };
  } catch {}

  const found = new Map();
  let ok = true;
  for (const q of ["topic:poa", "poa in:name"]) {
    try {
      const params = new URLSearchParams({ q, sort: "updated", per_page: "100" });
      const res = await fetch("https://api.github.com/search/repositories?" + params);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      for (const repo of data.items || []) {
        if (!repo.has_pages || !repo.owner) continue;
        const name = String(repo.name);
        if (q !== "topic:poa" && name.toLowerCase() !== "poa") continue;
        const host = String(repo.owner.login).toLowerCase() + ".github.io";
        // username.github.io is served at the root; any other repo in a folder named after it.
        const url = name.toLowerCase() === host
          ? "https://" + host + "/poa.md"
          : "https://" + host + "/" + encodeURIComponent(name) + "/poa.md";
        found.set(poaKey(url), url);
      }
    } catch {
      ok = false;
    }
  }
  const urls = [...found.values()];
  if (ok) {
    try { sessionStorage.setItem(KEY, JSON.stringify({ at: Date.now(), urls })); } catch {}
  }
  return { urls, ok };
}

// Load the discovered Poas that the walk didn't already reach. Each comes back as
// { poa, from }, where from is "directory" or "github". A Poa listed in both counts as
// "directory", since its owner chose to be listed there.
async function discoveredPoas(visited, alive) {
  const { directory, github } = await discover();
  const result = { found: [], directoryOk: directory.ok, githubOk: github.ok };
  if (!alive()) return result;
  const seen = new Set(visited);
  const pick = (urls, from) => urls
    .filter(u => { const k = poaKey(u); if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, DISCOVER_MAX_POAS)
    .map(url => ({ url, from }));
  const fresh = [...pick(directory.urls, "directory"), ...pick(github.urls, "github")];
  const loaded = await Promise.all(fresh.map(f =>
    limit(() => loadPoa(f.url)).then(poa => poa && poa.isPoa ? { poa, from: f.from } : null)));
  result.found = loaded.filter(Boolean);
  return result;
}

// ---------- READ BY ----------
// Every poa.md is public, so "who reads me" is worked out from the lists themselves:
// the same walk as search, plus the Poa directory and GitHub discovery. Nothing is sent anywhere.

let readersPromise = null;
function findReaders() {
  if (!readersPromise) readersPromise = (async () => {
    const me = poaKey(HOME);
    const readers = new Map();
    const check = poa => {
      const k = poaKey(poa.url);
      if (k === me || poa.noSearch) return;
      if (poa.reads.some(a => { const u = safePoaUrl(a); return u && poaKey(u) === me; })) readers.set(k, poa);
    };
    const visited = await walk(check, () => true);
    const { found } = await discoveredPoas(visited, () => true);
    found.forEach(f => check(f.poa));
    return [...readers.values()];
  })();
  return readersPromise;
}

// ---------- Search ----------

let searchRun = 0;

// q: the search term ("" lists everything). cat: the category to show first (null for all).
// wide: true for "Everywhere".
async function renderSearch(q, cat, wide) {
  const run = ++searchRun;
  const alive = () => run === searchRun;
  const article = document.getElementById("post");
  const heading = el("h1", { class: "title" });
  const status = el("p", { class: "status" }, "Searching…");
  const filters = el("div", { class: "filters", role: "group", "aria-label": "Categories" });
  const list = el("ul", { class: "results" });
  article.replaceChildren(heading, status, filters, list);

  let filter = cat || "";
  function setHeading() {
    const t = q ? "Search: " + q : filter ? "Category: " + filter : "Everything";
    heading.textContent = t;
    document.title = t + " · poa";
  }
  setHeading();

  const needle = fold(q.trim());
  const results = [];
  const tasks = [];
  let poaCount = 0;

  const away = r => r.from === "directory" ? "in the Poa directory" : r.from === "github" ? "found on GitHub"
    : r.depth === 0 ? "yours" : r.depth === 1 ? "1 step away" : r.depth + " steps away";

  function drawFilters() {
    const counts = new Map();
    for (const r of results) counts.set(r.cat, (counts.get(r.cat) || 0) + 1);
    if (filter && !counts.has(filter)) counts.set(filter, 0);
    const cats = [...counts.keys()].sort((a, b) =>
      (a === UNCATEGORIZED) - (b === UNCATEGORIZED) || counts.get(b) - counts.get(a) || a.localeCompare(b));
    const button = (key, label) => {
      const b = el("button", { type: "button", "aria-pressed": String(filter === key) }, label);
      b.addEventListener("click", () => {
        filter = key;
        // Update the address without running the search again.
        history.replaceState(null, "", searchLink(q, filter || (q ? null : ""), wide));
        setHeading();
        drawNow();
      });
      return b;
    };
    filters.replaceChildren(...(results.length ? [
      button("", "All (" + results.length + ")"),
      ...cats.map(c => button(c, c + " (" + counts.get(c) + ")")),
    ] : []));
  }

  function drawNow() {
    if (!alive()) return;
    results.sort((a, b) => (a.rank - b.rank) || (b.date > a.date) - (b.date < a.date));
    drawFilters();
    list.replaceChildren(...results.filter(r => !filter || r.cat === filter).map(r => {
      const meta = [r.href ? r.poa.name : "Poa", r.date ? formatDate(r.date) : null, r.cat, away(r)]
        .filter(Boolean).join(" · ");
      const snip = el("div", { class: "r-snip" });
      if (r.snippet) {
        const [before, hit, after] = r.snippet;
        snip.append(before, el("mark", {}, hit), after);
      }
      return el("li", {}, el("a", { href: link(r.poa.url, r.href) },
        el("div", { class: "r-meta" }, meta),
        el("span", { class: "r-title" }, r.title),
        r.snippet ? snip : null));
    }));
  }

  // Redraw at most once a frame while results stream in.
  let drawPending = false;
  function draw() {
    if (drawPending) return;
    drawPending = true;
    requestAnimationFrame(() => { drawPending = false; drawNow(); });
  }

  function snippetOf(text) {
    const i = fold(text).indexOf(needle);
    if (i < 0) return null;
    const start = Math.max(0, i - 60);
    const end = Math.min(text.length, i + needle.length + 100);
    return [
      (start > 0 ? "…" : "") + text.slice(start, i),
      text.slice(i, i + needle.length),
      text.slice(i + needle.length, end) + (end < text.length ? "…" : ""),
    ];
  }

  // depth: steps away in your network. from: "directory" or "github" for Poas found outside it.
  function searchPoa(poa, depth, from = null) {
    poaCount++;
    // Poas that say "search: no" are left out (their lists are still followed). Yours always shows.
    if (poa.noSearch && depth !== 0) return;
    const poaCat = poa.category || UNCATEGORIZED;
    if (fold(poa.name).includes(needle)) {
      results.push({ poa, depth, from, rank: 0, title: poa.name, href: null, date: "", cat: poaCat });
    }
    poa.posts.forEach((p, i) => {
      const titleHit = fold(p.title).includes(needle);
      const add = (extra, body) => results.push({
        poa, depth, from, title: p.title, href: p.href,
        date: (body && body.date) || dateFrom(p.href),
        // A post's own category wins; otherwise it has its Poa's.
        cat: (body && body.category) || poaCat,
        ...extra,
      });
      if (i >= SEARCH_POSTS_EACH) {
        if (titleHit) add({ rank: 1 });
        return;
      }
      // Open the newest posts for their text and for a category of their own.
      tasks.push(limit(() => loadBody(new URL(p.href, poa.url).href)).then(body => {
        if (!alive()) return;
        if (titleHit) {
          add({ rank: 1 }, body);
        } else if (body && needle) {
          const snippet = snippetOf(body.text);
          if (snippet) add({ rank: 2, snippet }, body);
        }
        draw();
      }));
    });
    draw();
  }

  const visited = await walk((poa, depth) => {
    searchPoa(poa, depth);
    status.textContent = "Searching… " + poaCount + " Poas so far";
  }, alive);
  if (!alive()) return;
  const networkCount = poaCount;

  let dirCount = 0, gitHubCount = 0, directoryOk = true, githubOk = true;
  if (wide) {
    status.textContent = "Looking for more Poas…";
    const d = await discoveredPoas(visited, alive);
    if (!alive()) return;
    ({ directoryOk, githubOk } = d);
    for (const { poa, from } of d.found) {
      searchPoa(poa, -1, from);
      if (poa.noSearch) continue;
      if (from === "directory") dirCount++; else gitHubCount++;
    }
  }

  await Promise.all(tasks);
  if (!alive()) return;
  drawNow();
  let text = (results.length ? results.length + " found" : "Nothing found") +
    " in " + networkCount + (networkCount === 1 ? " Poa" : " Poas") + " up to " + SEARCH_STEPS + " steps away";
  if (wide) {
    const more = [];
    if (DIRECTORY && directoryOk) more.push(dirCount + " in the Poa directory");
    if (githubOk) more.push(gitHubCount + " found on GitHub");
    text += more.length ? ", plus " + more.join(" and ") + "." : ".";
    if (DIRECTORY && !directoryOk) text += " The Poa directory couldn't be reached just now.";
    if (!githubOk) text += " GitHub didn't answer just now, so some Poas outside your network may be missing. Try again in a minute.";
  } else text += ".";
  status.textContent = text;
}

// ---------- Main ----------

async function show() {
  const p = new URLSearchParams(location.hash.slice(1));
  const q = p.get("q");
  if (q || p.has("cat")) {
    searchRun++;
    everywhere = p.get("in") === "all";
    const home = await loadPoa(HOME);
    if (home) renderSide(home, null, q);
    renderSearch(q || "", p.get("cat"), everywhere);
    return;
  }
  searchRun++; // stop any search still running
  const r = route();
  const poa = await loadPoa(r.poa);
  if (!poa) {
    document.getElementById("side").replaceChildren(
      el("a", { class: "back", href: "#" }, "← Back"));
    document.getElementById("post").replaceChildren(
      el("p", { class: "notice" }, "This Poa can't be reached right now."));
    return;
  }
  const href = r.post || (poa.posts[0] && poa.posts[0].href);
  renderSide(poa, href);
  renderPost(poa, href);
}

window.addEventListener("hashchange", show);
show();
</script>
</body>
